<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>IMCO — لوحة الإدارة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090a;color:#fff;font-family:Cairo,Arial,sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:860px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin:10px 0 24px}
h1{font-size:22px;font-weight:800}
.card{background:#111214;border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:22px;margin-bottom:18px}
label{display:block;font-size:13px;color:#aaa;margin:14px 0 6px}
input,textarea{width:100%;background:#0a0b0c;border:1px solid rgba(255,255,255,.16);border-radius:12px;color:#fff;font:inherit;padding:12px 14px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:0;border-color:#aaa}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;padding:10px 16px;font-weight:700}
button.primary{background:#fff;color:#111;border-color:#fff;width:100%;margin-top:18px;padding:13px}
button.danger{color:#ff8a8a;border-color:#ff8a8a55}
button:disabled{opacity:.5;cursor:wait}
.msg{margin-top:12px;font-size:13px;min-height:18px}.err{color:#ff8a8a}.ok{color:#8aff9f}
.preview{margin-top:10px;max-height:220px;border-radius:12px;display:none}
.item{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.item:first-child{border-top:0}
.item img{width:84px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:#222}
.item .t{flex:1;min-width:0}.item b{display:block}.item small{color:#888;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts button{padding:7px 11px;font-size:13px}
.hide{display:none!important}
@media(max-width:560px){.item{flex-wrap:wrap}.acts{width:100%}}
</style>
</head>
<body>
<div class="wrap">

<div id="loginView" class="card hide" style="max-width:380px;margin:12vh auto 0">
  <h1>دخول الإدارة</h1>
  <label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username">
  <label>كلمة السر</label><input id="pass" type="password" autocomplete="current-password">
  <button class="primary" id="loginBtn">دخول</button>
  <div class="msg err" id="loginMsg"></div>
</div>

<div id="appView" class="hide">
  <div class="top"><h1>إدارة مشاريع IMCO</h1><div><a href="./" target="_blank"><button>عرض الموقع</button></a> <button id="logout">خروج</button></div></div>

  <div class="card">
    <h1 id="formTitle" style="font-size:18px">إضافة مشروع</h1>
    <label>اسم المشروع</label><input id="title" maxlength="80">
    <label>الوصف</label><textarea id="desc" maxlength="400"></textarea>
    <label id="imgLabel">الصورة</label><input id="file" type="file" accept="image/*">
    <img id="preview" class="preview" alt="">
    <button class="primary" id="saveBtn">حفظ</button>
    <button class="hide" id="cancelBtn" style="width:100%;margin-top:8px">إلغاء التعديل</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card"><h1 style="font-size:18px;margin-bottom:6px">المشاريع الحالية</h1><div id="list"></div></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyC20igp-NBY6VSxrWXut6nqz__dCOszDAE",
  authDomain: "imco-c52a1.firebaseapp.com",
  projectId: "imco-c52a1",
  storageBucket: "imco-c52a1.firebasestorage.app",
  messagingSenderId: "1089650607064",
  appId: "1:1089650607064:web:b6ea034e0b51296c6de8ad"
};
const cloudinary = { cloudName: "dd3xs6mqn", uploadPreset: "Imco.....photo" };


const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(firebaseConfig.projectId.startsWith('YOUR')){document.body.innerHTML='<p style="padding:40px;text-align:center">عدّل ملف config.js أولًا (راجع README).</p>';throw 0}

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),col=collection(db,'projects');
let items=[],editing=null;

onAuthStateChanged(auth,u=>{
  $('loginView').classList.toggle('hide',!!u);
  $('appView').classList.toggle('hide',!u);
  if(u)load();
});
$('loginBtn').onclick=async()=>{
  $('loginMsg').textContent='';
  try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('pass').value)}
  catch{$('loginMsg').textContent='البريد أو كلمة السر غير صحيحة'}
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('logout').onclick=()=>signOut(auth);

async function load(){
  const snap=await getDocs(query(col,orderBy('order')));
  items=snap.docs.map(d=>({id:d.id,...d.data()}));
  $('list').innerHTML=items.length?items.map((p,i)=>`<div class="item">
    <img src="${esc(p.thumb||p.image)}" alt=""><div class="t"><b>${esc(p.title)}</b><small>${esc(p.description||'')}</small></div>
    <div class="acts"><button data-a="up" data-i="${i}" ${i===0?'disabled':''}>↑</button><button data-a="down" data-i="${i}" ${i===items.length-1?'disabled':''}>↓</button>
    <button data-a="edit" data-i="${i}">تعديل</button><button class="danger" data-a="del" data-i="${i}">حذف</button></div></div>`).join('')
    :'<p style="color:#888;padding:14px 0">لا توجد مشاريع بعد.</p>';
}
$('list').onclick=async e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const i=+b.dataset.i,p=items[i];
  try{
    if(b.dataset.a==='del'){if(!confirm('حذف "'+p.title+'"؟'))return;await deleteDoc(doc(db,'projects',p.id));load()}
    if(b.dataset.a==='edit'){editing=p;$('title').value=p.title;$('desc').value=p.description||'';$('formTitle').textContent='تعديل مشروع';$('imgLabel').textContent='صورة جديدة (اتركها فارغة للإبقاء على الحالية)';$('cancelBtn').classList.remove('hide');$('preview').src=p.image;$('preview').style.display='block';scrollTo({top:0,behavior:'smooth'})}
    if(b.dataset.a==='up'||b.dataset.a==='down'){
      const q=items[i+(b.dataset.a==='up'?-1:1)];if(!q)return;
      await Promise.all([updateDoc(doc(db,'projects',p.id),{order:q.order}),updateDoc(doc(db,'projects',q.id),{order:p.order})]);load()
    }
  }catch(err){say('حدث خطأ: '+err.message,'err')}
};
$('file').onchange=()=>{const f=$('file').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}};
function reset(){editing=null;$('title').value='';$('desc').value='';$('file').value='';$('preview').style.display='none';$('formTitle').textContent='إضافة مشروع';$('imgLabel').textContent='الصورة';$('cancelBtn').classList.add('hide')}
$('cancelBtn').onclick=()=>{reset();say('')};
function say(t,c){$('msg').textContent=t;$('msg').className='msg '+(c||'')}

async function uploadImage(file){
  const fd=new FormData();fd.append('file',file);fd.append('upload_preset',cloudinary.uploadPreset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${cloudinary.cloudName}/image/upload`,{method:'POST',body:fd});
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'فشل رفع الصورة');
  // optimized delivery (auto format/quality, resized)
  return{image:j.secure_url.replace('/upload/','/upload/f_auto,q_auto,w_2000,c_limit/'),
         thumb:j.secure_url.replace('/upload/','/upload/f_auto,q_auto,w_1400,c_limit/')};
}
$('saveBtn').onclick=async()=>{
  const title=$('title').value.trim(),description=$('desc').value.trim(),file=$('file').files[0];
  if(!title)return say('اكتب اسم المشروع','err');
  if(!editing&&!file)return say('اختر صورة','err');
  if(file&&file.size>15*1024*1024)return say('الصورة أكبر من 15MB','err');
  $('saveBtn').disabled=true;say('جارٍ الحفظ…');
  try{
    const img=file?await uploadImage(file):{};
    if(editing)await updateDoc(doc(db,'projects',editing.id),{title,description,...img});
    else await addDoc(col,{title,description,...img,order:Date.now(),createdAt:serverTimestamp()});
    reset();say('تم الحفظ ✓','ok');load();
  }catch(e){say(e.message||'حدث خطأ','err')}
  $('saveBtn').disabled=false;
};
</script>
</body>
</html>
